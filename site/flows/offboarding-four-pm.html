:root { --bg:#1c232d; --lane:#232c38; --lane2:#283241; --line:#445266; --ink:#efe9f5; --ink2:#b4bccb; --allow:#46d6c8; --masked:#a78bfa; --deny:#ff6b6b;
  --hold:#f5b83d; --dead:#8791a0; --badge:#efe9f5; --badge-ink:#1c232d; --plate:#11161d; --plate-ink:#efe9f5; --accent:#f5b83d; --accent-ink:#1c232d;

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--f-text); -webkit-text-size-adjust: 100%; }
body.render { overflow: hidden; }
button { font: inherit; color: inherit; }
.app { display: flex; flex-direction: column; align-items: center; width: 100%; }
.fit { position: relative; width: 100%; overflow: hidden; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
.stage svg { position: absolute; left: 0; top: 0; display: block; }
