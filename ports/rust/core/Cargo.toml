[package]
name = "smartdelegate-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SmartDelegate core: policy decision, delegation tokens, field masking, audit"

[lib]
name = "smartdelegate_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
cedar-policy = "4"
jsonwebtoken = "9"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
