# CI: on every push to master and every pull request.
#   test           the reference tests, the scenario harness and the skills check (gates merges)
#   install-lines  no document names a package the maintainers do not hold (gates merges)
#   ports          the two shared suites against all six engines; shown, does not gate yet
# Actions are pinned to commits (comment: tag, date read). Only GitHub-owned
# actions are used; Rust and PHP come from the runner image.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, read 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, read 2026-10-08
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e . pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: Scenario harness
        run: python -m harness run
      - name: Skills check
        run: python skills/validate.py

  install-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, read 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, read 2026-10-08
        with:
          python-version: '3.12'
      - name: No document names a package the maintainers do not hold
        run: python scripts/check_install_lines.py

  ports:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # not a required check yet: it has not run on GitHub before
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, read 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, read 2026-10-08
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1, read 2026-10-08
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0, read 2026-10-08
        with:
          node-version: '22'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0, read 2026-10-09
        with:
          go-version: '1.24'
          cache: false
      - name: Install the reference
        run: python -m pip install -e .
      - name: Toolchains on the runner
        run: |
          rustc --version; cargo --version
          php --version; php -m | grep -i sodium
      - name: Policy evaluation cases and conformance vectors, all six engines
        run: ports/conformance/run.sh
