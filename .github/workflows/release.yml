# Release. Runs when a maintainer pushes a tag vX.Y.Z (tags are protected by a
# ruleset). No token or password exists anywhere:
#   - PyPI upload: Trusted Publishing (OIDC). The PyPI project trusts exactly
#     this repository, this file (release.yml) and the environment "pypi".
#     The environment requires a second maintainer's approval.
#   - Provenance: PyPI attestations (made by pypa/gh-action-pypi-publish) and
#     GitHub artifact attestations for the same files
#     (verify: gh attestation verify <file> --repo SmartTasksOrg/sf-smartdelegate).
# Actions are pinned to commits; the comment gives the tag and the day it was
# read with git ls-remote.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, read 2026-10-08
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, read 2026-10-08
        with:
          python-version: '3.12'
      - name: The tag must equal the package version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the package version $version" >&2
            exit 1
          fi
      - name: No document names a package the maintainers do not hold
        working-directory: .
        run: python scripts/check_install_lines.py
      - name: Build the sdist and the wheel
        run: |
          python -m pip install "build==1.6.1"
          python -m build
      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install dist/*.whl
          /tmp/wheel-check/bin/sf-smartdelegate --version
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1, read 2026-10-08
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write        # Sigstore signing identity for the attestation
      attestations: write    # store the attestation with the repository
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1, read 2026-10-08
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2, read 2026-10-08
        with:
          subject-path: 'dist/*'

  pypi:
    name: Upload to PyPI
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/sf-smartdelegate/
    permissions:
      id-token: write        # PyPI Trusted Publishing; this job has no other permission
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1, read 2026-10-08
        with:
          name: dist
          path: dist
      - name: Upload only the distributions
        run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2, read 2026-10-08
        # attestations are on by default when Trusted Publishing is used

  github-release:
    name: GitHub release
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the release and attach the files
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1, read 2026-10-08
        with:
          name: dist
          path: dist
      - name: Create the release with the same files and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "SmartDelegate $GITHUB_REF_NAME"
          --generate-notes --verify-tag
